<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator UI - Muhammad Yousuf</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Calculator Container */
        .calculator {
            background: #22252d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 320px;
        }

        /* Display Screen */
        .calculator-screen {
            width: 100%;
            height: 60px;
            background: #2a2d37;
            color: #ffffff;
            font-size: 24px;
            text-align: right;
            padding: 15px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        /* Buttons Grid */
        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #292d3e;
            color: #ffffff;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #3b4256;
        }

        /* Operators & Special Buttons */
        .operator {
            background-color: #ff9500;
            color: #ffffff;
        }

        .operator:hover {
            background-color: #e08500;
        }

        .clear {
            background-color: #ff3b30;
            color: #ffffff;
        }

        .clear:hover {
            background-color: #d32f2f;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <!-- Calculator Box -->
    <div class="calculator">
        <input type="text" class="calculator-screen" value="0" disabled>

        <div class="calculator-keys">
            <button class="clear">C</button>
            <button>DEL</button>
            <button>%</button>
            <button class="operator">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>
    </div>

</body>
</html>
